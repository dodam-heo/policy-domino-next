<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="공식 정책 변경에서 실제 변경 문구와 공공기관 업무 파급 근거를 추적합니다.">
  <title>정책도미노 NEXT | 정책의 변화가 업무로 이어지는 길</title>
  <style>
    :root{--ink:#142d40;--muted:#607789;--navy:#0c3046;--accent:#146c83;--aqua:#e7f4f3;
      --line:#dce5ea;--canvas:#f4f7f9;--paper:#fff;--gold:#aa6b1e;--blue:#175873}
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
    button,input{font:inherit}button{cursor:pointer}a{color:var(--blue);text-underline-offset:3px}
    .hero{background:linear-gradient(120deg,#08283d,#17495e);color:white;padding:30px max(22px,calc((100vw - 1370px)/2))}
    .brand{font-weight:850;letter-spacing:.08em;font-size:14px;color:#b4e7e8}
    .hero h1{font-size:clamp(24px,3vw,37px);line-height:1.25;letter-spacing:-.045em;margin:11px 0}
    .hero p{font-size:14px;color:#d1e1e8;margin:6px 0 0;max-width:820px}
    .status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1370px;margin:-11px auto 18px;padding:0 22px;position:relative}
    .metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:0 3px 17px #142d4007}
    .metric b{display:block;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.2}
    .metric span{font-size:12px;color:var(--muted);font-weight:650}
    .container{display:grid;grid-template-columns:minmax(285px,390px) minmax(0,1fr);gap:16px;max-width:1370px;padding:0 22px 42px;margin:auto;align-items:start}
    .panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #18324507}
    .panel-head{padding:19px 20px 15px;border-bottom:1px solid var(--line)}
    .panel-head h2{margin:0 0 4px;font-size:17px}
    .sub{color:var(--muted);font-size:12px}
    .search{margin-top:13px;border:1px solid #cad9e1;border-radius:9px;width:100%;padding:12px 13px;background:#fbfdfe;outline-color:var(--accent)}
    .item-list{max-height:70vh;overflow:auto}
    .item{border:0;border-bottom:1px solid #edf1f3;background:#fff;padding:17px 20px;width:100%;text-align:left;color:inherit;display:block}
    .item:hover,.item:focus-visible{background:#f2f8fa}
    .item.selected{background:var(--aqua);border-left:4px solid #0f7189;padding-left:16px}
    .item h3{font-size:14px;line-height:1.55;letter-spacing:-.02em;margin:6px 0}
    .micro{font-size:11px;color:var(--muted)}
    .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
    .pill{border:1px solid #cadce1;background:#f5fafa;color:#305a68;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:650}
    .pill.verified{background:#e6f4e8;color:#286245;border-color:#cae5d0}
    .pill.pending{background:#fff8eb;color:#92631c;border-color:#f2dfb7}
    .more{display:block;width:calc(100% - 34px);margin:16px auto;padding:11px;border-radius:8px;border:1px solid #ccdbe2;background:white;color:var(--blue)}
    .detail{min-height:570px;padding:26px clamp(18px,3vw,37px)}
    .detail-head{border-bottom:1px solid var(--line);padding-bottom:21px;margin-bottom:24px}
    .detail-head h2{font-size:clamp(22px,2.3vw,31px);line-height:1.38;letter-spacing:-.04em;margin:8px 0 10px}
    .eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.03em}
    .state-note{margin-top:14px;background:#f1f7f9;padding:12px 15px;border-radius:8px;color:#3c6677;font-size:12px}
    section{margin:0 0 27px}
    section h3{font-size:17px;letter-spacing:-.03em;margin:0 0 10px}
    .help{font-size:12px;color:var(--muted);margin:4px 0 13px}
    .change{padding:16px 0;border-top:1px solid var(--line)}
    .change:first-of-type{border-top:0}
    .change-title{font-weight:800;font-size:14px;margin-bottom:12px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .before,.after{border-radius:8px;padding:14px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:65px}
    .before{background:#f7f4f1;border:1px solid #e9dfd7}
    .after{background:#eef7f3;border:1px solid #cfe7de}
    .value-label{display:block;font-size:11px;letter-spacing:.05em;font-weight:850;margin-bottom:6px}
    .source{font-size:12px;font-weight:650;margin-top:9px;display:inline-block}
    .agency-card{padding:16px;border:1px solid #d8e5e8;border-radius:10px;margin:10px 0}
    .agency-card strong{font-size:14px}
    .divider{height:1px;background:var(--line);margin:22px 0}
    .empty{padding:24px 18px;color:var(--muted);text-align:center;font-size:13px}
    .muted-box{background:#f6f8fa;border:1px dashed #d6e0e5;padding:19px;border-radius:10px;color:#5d7180;font-size:13px}
    .footer{max-width:1370px;margin:0 auto 35px;padding:0 22px;color:#778b97;font-size:11px}
    .footer a{color:inherit}
    .small-action{background:transparent;border:1px solid #d3e0e5;color:#315b6e;border-radius:6px;padding:5px 8px;font-size:11px}
    @media(max-width:800px){.hero{padding:22px}.status{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 14px}.container{grid-template-columns:1fr;padding:0 14px 28px}.item-list{max-height:390px}.detail{min-height:320px}.two{grid-template-columns:1fr}.footer{padding:0 18px}}
  </style>
</head>
<body>
<header class="hero">
  <div class="brand">POLICY DOMINO · NEXT</div>
  <h1>정책의 변화가 업무에 미치는 영향까지.</h1>
  <p>공식 개정문을 비교하고, 그 변경을 인용하는 관련 규정을 추적합니다. 실제 기관·사업 적용이 확인되지 않은 결과는 분리합니다.</p>
</header>
<div class="status" aria-label="수집 현황">
  <div class="metric"><b id="indexed">—</b><span>공식 목록 수집</span></div>
  <div class="metric"><b id="compared">—</b><span>본문 변경 확인</span></div>
  <div class="metric"><b id="pending">—</b><span>분석 대기·재검증</span></div>
  <div class="metric"><b id="links">—</b><span>변경 조문 직접 인용</span></div>
</div>
<main class="container">
  <aside class="panel" aria-label="공식 변경 목록">
    <div class="panel-head">
      <h2>공식 변경 목록</h2>
      <div class="sub" id="feed-state">원천자료 확인 중</div>
      <input class="search" id="search" type="search" autocomplete="off" placeholder="정책명 또는 소관기관 검색" aria-label="정책 검색">
    </div>
    <div class="item-list" id="items"><div class="empty">원천자료를 불러오는 중</div></div>
    <button class="more" id="more" hidden>다음 목록 더 보기</button>
  </aside>
  <article class="panel detail" id="detail" aria-live="polite"><div class="empty">변경된 정책을 선택하면 실제 바뀐 내용과 파급 근거를 확인할 수 있습니다.</div></article>
</main>
<footer class="footer">
  출처: <a href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터</a> ·
  실제 내부 규정 반영·기관의 조치 완료 여부는 공개자료만으로 확인되지 않습니다. ·
  <span id="updated"></span>
</footer>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const state = {data: null, selected: null, query: "", visible: 80};
  const create = (tag, className, content) => {
    const el = document.createElement(tag);
    if(className) el.className = className;
    if(content !== undefined) el.textContent = String(content);
    return el;
  };
  const append = (parent, ...items) => items.forEach(item => {if(item)parent.appendChild(item)});
  const normalize = str => String(str || "").toLocaleLowerCase("ko-KR");
  const badge = (content, kind) => create("span", "pill " + (kind || ""), content);
  const num = n => Number(n || 0).toLocaleString("ko-KR");
  const okHref = link => {
    try{
      const u = new URL(link);
      if(u.protocol !== "https:")return null;
      if(u.hostname !== "www.law.go.kr" && u.hostname !== "law.go.kr")return null;
      return u.href;
    }catch{return null;}
  };
  function external(url, title){
    const safe = okHref(url);
    if(!safe)return create("span","micro","공식 링크 미확인");
    const a = create("a","source",title || "공식 원문 확인");
    a.href = safe;a.target="_blank";a.rel="noopener noreferrer";
    return a;
  }
  function analysisLabel(a){
    const x = a?.status || "queued";
    return ({
      compared: ["실제 신구 비교 확인","verified"],
      partial_compared: ["일부 조문 비교 · 나머지 미확인","pending"],
      enactment: ["신규 제정 본문 확인","verified"],
      repeal: ["공식 폐지 확인","verified"],
      no_text_change: ["본문 변경 미검출",""],
      queued: ["본문 비교 대기","pending"],
      baseline_unavailable: ["종전 본문 미확보","pending"],
      history_unavailable: ["종전 이력 확인 실패","pending"],
      partial_unresolved: ["일부 조문 비교 불가","pending"],
      body_unavailable: ["공식 본문 미확보","pending"],
      source_error: ["원천 접근·분석 오류","pending"],
    })[x] || ["검증 대기","pending"];
  }
  const heading = (title, help) => {
    const s=create("section");
    append(s,create("h3","",title));
    if(help)append(s,create("p","help",help));
    return s;
  };
  function renderDetail(){
    const doc=state.data.documents.find(d=>d.id===state.selected);
    const root=$("detail");root.replaceChildren();
    if(!doc){append(root,create("div","empty","변경 항목을 선택해 주세요."));return;}
    const analysis=doc.analysis || {};
    const top=create("header","detail-head");
    append(top,create("div","eyebrow",doc.kind+" · "+doc.published_at),
      create("h2","",doc.title),
      create("div","sub",doc.ministry||"공식 소관기관 정보 없음"),
      badge(analysisLabel(analysis)[0],analysisLabel(analysis)[1]),
      external(doc.url,"공식 법령 페이지"));
    append(root,top);

    // ① Actual changed clauses always precede agency review.
    const changes=heading("① 정책에서 실제 바뀐 내용",
      "종전·현행 공식 문서에서 같은 조문을 대조한 결과입니다.");
    const diffs=analysis.changes || [];
    if(!diffs.length){
      append(changes,create("div","muted-box",analysis.reason ||
        "종전 또는 현행 본문을 검증하지 못했습니다. 변경 내용을 임의로 작성하지 않습니다."));
    }else{
      for(const c of diffs){
        const card=create("div","change");
        append(card,create("div","change-title",c.article+" · "+c.category));
        const flex=create("div","two");
        const old=create("div","before"),updated=create("div","after");
        append(old,create("span","value-label","변경 전"),create("div","",c.before));
        append(updated,create("span","value-label","변경 후"),create("div","",c.after));
        append(flex,old,updated);append(card,flex,external(c.source_url,"변경 조문 공식 출처"));
        append(changes,card);
      }
    }
    append(root,changes);

    // ② Verified program duties require INDEPENDENT operational evidence.
    const impacts=heading("② 기관별 변경 검토사항",
      "공식 인용이 확인됐다는 사실과 실제 기관·사업의 조치가 필요하다는 판단은 구분합니다.");
    const edges=state.data.relationships.filter(e=>e.source_event_id===doc.id);
    const confirmed=edges.filter(e=>e.operational_program_verified &&
      e.required_action_verified);
    if(!confirmed.length){
      append(impacts,create("div","muted-box",
        "변경된 정책이 특정 공공기관의 실제 사업기준을 어떻게 바꿔야 하는지까지 검증된 결과는 아직 없습니다. 관련 규정 인용만으로 기관에 변경 의무를 부여하지 않습니다."));
    }
    for(const edge of confirmed){
      const card=create("div","agency-card");
      append(card,create("strong","",edge.verified_agency),
        create("div","micro",edge.verified_program),
        create("p","",edge.required_review),
        external(edge.official_operational_url,"사업 운영 근거"));
      append(impacts,card);
    }
    append(root,impacts);

    const related=heading("③ 변경 조문을 직접 인용하는 관련 규정",
      "인용된 조문이 실제 변경 조문과 정확히 일치할 때만 표시합니다. 사업 영향의 확정 근거는 아닙니다.");
    if(!edges.length)append(related,create("div","muted-box",
      "검증된 직접 인용 관계가 없습니다. 실제로 관련 기관이 없다는 뜻은 아닙니다."));
    for(const edge of edges){
      const card=create("div","agency-card");
      append(card,create("strong","",edge.referencing_title),
        create("div","micro",edge.referencing_article+" → "+edge.changed_article),
        create("p","",edge.reference_quote),
        create("div","micro","공포 소관: "+(edge.publishing_agency||"확인 필요")+
          " · 실제 사업 적용 미검증"),
        external(edge.referencing_source_url,"관련 규정 원문"));
      append(related,card);
    }
    append(root,related);

    const topics=heading("④ 원문 변경에 따른 추가 검토 후보",
      "기관을 배정하지 않은 변경 항목입니다. 실제 기관별 조치 확정과 구분합니다.");
    if(!(analysis.review_candidates||[]).length){
      append(topics,create("p","help","확정된 신구 조문이 없어 후보를 만들지 않았습니다."));
    }
    for(const c of analysis.review_candidates||[]){
      const card=create("div","agency-card");
      append(card,create("strong","",c.article+" · "+c.category),
        create("p","",c.review),
        create("div","micro","근거 수준: 개정 조문에만 기반 · 기관 미배정"));
      append(topics,card);
    }
    append(root,topics);

    if(analysis.excluded?.length){
      const note=create("div","state-note");
      note.textContent="비교 제외 조문 "+analysis.excluded.length+
        "개: 불완전한 원문을 변경으로 추정하지 않았습니다.";
      append(root,note);
    }
    const prior=analysis.baseline;
    if(prior)append(root,external(prior.url,"종전 버전의 공식 원문 확인"));
  }
  function filtered(){
    return (state.data?.documents||[]).filter(doc=>
      normalize(doc.title+" "+doc.ministry).includes(state.query));
  }
  function renderList(){
    const list=$("items");list.replaceChildren();
    const all=filtered();
    $("feed-state").textContent=num(all.length)+"건 표시 · 공식 개정일 최신순";
    if(!all.length)append(list,create("div","empty","수집된 항목이 없거나 검색 결과가 없습니다."));
    for(const doc of all.slice(0,state.visible)){
      const row=create("button","item"+(doc.id===state.selected?" selected":""));
      row.type="button";row.dataset.id=doc.id;
      append(row,create("div","micro",(doc.published_at||"날짜 미확인")+" · "+doc.kind),
        create("h3","",doc.title));
      const tags=create("div","pills");
      append(tags,badge(analysisLabel(doc.analysis)[0],analysisLabel(doc.analysis)[1]));
      const changes=doc.analysis?.changes?.length||0;
      if(changes)append(tags,badge("변경 조문 "+changes+"개"));
      append(row,tags);
      row.onclick=()=>{state.selected=doc.id;renderList();renderDetail();};
      append(list,row);
    }
    $("more").hidden=all.length<=state.visible;
  }
  function show(data){
    if(data.schema!=="policy-domino-next-v1")throw Error("잘못된 데이터 스키마");
    data.documents=data.documents||[];data.relationships=data.relationships||[];
    state.data=data;state.selected=data.documents[0]?.id||null;
    const q=data.quality||{};
    $("indexed").textContent=num(data.documents.length);
    $("compared").textContent=num(["law","admrul","ordin"].reduce(
      (sum,k)=>sum+(q[k]?.verified_changes||0),0));
    $("pending").textContent=num(["law","admrul","ordin"].reduce(
      (sum,k)=>sum+(q[k]?.waiting||0),0));
    $("links").textContent=num(data.relationships.length);
    $("updated").textContent=data.generated_at?"마지막 분석 "+data.generated_at:
      "원천 API 미실행 · LAW_OC 설정 후 공식 수집 시작";
    if(data.configuration!=="running")
      $("feed-state").textContent="LAW_OC 인증 설정 필요";
    renderList();renderDetail();
  }
  $("search").oninput=ev=>{state.query=normalize(ev.target.value);state.visible=80;renderList();};
  $("more").onclick=()=>{state.visible+=80;renderList();};
  fetch("./data.json",{cache:"no-store"}).then(res=>{
    if(!res.ok)throw Error("정책 데이터 응답 오류");
    return res.json();
  }).then(show).catch(err=>{
    $("items").replaceChildren(create("div","empty","원천 데이터를 불러오지 못했습니다."));
    $("detail").replaceChildren(create("div","muted-box",String(err)));
    $("feed-state").textContent="수집 데이터 연결 오류";
  });
})();
</script>
</body>
</html>
