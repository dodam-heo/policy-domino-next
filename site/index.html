<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="공식 정책 변경에서 실제 변경 문구와 공공기관 업무 파급 근거를 추적합니다.">
  <title>정책도미노 NEXT | 정책의 변화가 업무로 이어지는 길</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="hero">
  <div class="brand">POLICY DOMINO · NEXT</div>
  <h1>정책의 변화가 업무에 미치는 영향까지.</h1>
  <p>공식 정책 변경의 실제 차이와 공공기관·사업에 미치는 영향을 근거와 함께 확인합니다.</p>
</header>
<main class="container" id="layout">
  <aside class="panel" id="listPanel" aria-label="공식 변경 목록">
    <div class="panel-head">
      <h2>공식 정책 변경 목록</h2>
      <div class="sub">최신 변경부터 확인하고, 항목을 선택해 상세 내용을 볼 수 있습니다.</div>
      <div class="filters" aria-label="정책 필터와 정렬">
        <div class="filter-group" role="group" aria-label="변경 유형 필터">
          <button type="button" class="filter-chip active" id="mode-all" data-mode="all" aria-pressed="true">전체</button>
          <button type="button" class="filter-chip" id="mode-new" data-mode="new" aria-pressed="false">신규</button>
          <button type="button" class="filter-chip" id="mode-amended" data-mode="amended" aria-pressed="false">개정</button>
          <button type="button" class="filter-chip" id="mode-repealed" data-mode="repealed" aria-pressed="false">폐지</button>
        </div>

      </div>
      <input class="search" id="search" type="search" autocomplete="off" placeholder="법령명·정책명·소관기관 검색" aria-label="정책 검색">
      <div class="sub" id="feed-state" aria-live="polite">원천자료 확인 중</div>
    </div>
    <div class="item-list" id="items"><div class="empty">원천자료를 불러오는 중</div></div>
    <button class="more" id="more" hidden>다음 목록 더 보기</button>
  </aside>
  <section class="panel detail-pane" id="detailPanel" aria-label="선택한 정책의 변경 및 기관별 검토">
    <nav class="detail-toolbar" aria-label="목록으로 돌아가기">
      <button type="button" class="back-to-list" id="backToList">← 정책 변경 목록</button>
    </nav>
    <article class="detail" id="detail" aria-live="polite"><div class="empty">변경된 정책을 선택하면 실제 바뀐 내용과 파급 근거를 확인할 수 있습니다.</div></article>
  </section>
</main>
<footer class="footer">
  출처: <a href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터</a> ·
  <span id="updated"></span>
</footer>
<script src="./presentation.js"></script>
<script src="./app.js"></script>
</body>
</html>
