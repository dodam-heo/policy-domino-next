<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="공식 정책 변경 사건에서 공공기관·사업별 업무 영향과 검토할 변경사항을 확인합니다.">
  <title>정책도미노 NEXT | 정책 변경과 공공기관 업무 영향</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="intro home-banner" href="./" aria-label="정책도미노 첫 화면으로 돌아가기">
  <div class="intro-copy">
    <p class="eyebrow">공식 정책 변경 · 업무 영향 분석</p>
    <h1>무엇이 바뀌고, 어디에 영향을 줄까?</h1>
    <p>법령·고시 등 정책이 바뀌면, 어느 기관의 어떤 사업·업무에 어떤 변경이 필요한지 공식 근거와 함께 확인합니다.</p>
  </div>
  <div class="summary" aria-label="확인된 정책 변경 결과">
    <div><small>수집된 공식 판본</small><strong id="stat-events">—</strong></div>
    <div><small>검토 대상 기관</small><strong id="stat-agencies">—</strong></div>
    <div><small>업무 검토사항</small><strong id="stat-actions">—</strong></div>
  </div>
</a>
<div class="directory-toolbar">
  <button id="agency-directory-open" type="button" class="directory-open-button">공공기관 명부 보기</button>
</div>
<div id="agency-directory-modal" class="agency-directory-modal" hidden>
  <div id="agency-directory-backdrop" class="agency-directory-backdrop"></div>
  <section class="agency-directory-dialog" role="dialog" aria-modal="true" aria-labelledby="agency-directory-heading">
    <div class="agency-directory-top"><h2 id="agency-directory-heading">공공기관 명부</h2>
      <button id="agency-directory-close" type="button">닫기</button></div>
    <p class="agency-directory-note">공식 자료에 등록된 기관 목록입니다. 명부 등재와 정책별 영향 확인은 별개입니다.</p>
    <input id="agency-directory-search" type="search" placeholder="기관명 검색" autocomplete="off" aria-label="공공기관 명부 기관명 검색">
    <p id="agency-directory-count" class="agency-directory-count" aria-live="polite"></p>
    <div id="agency-directory-results" class="agency-directory-results" role="list" aria-live="polite"></div>
  </section>
</div>
<main id="layout" class="layout">
  <aside class="panel list-panel" id="listPanel" aria-label="정책 변경 사건 목록">
    <div class="list-heading">
      <div class="panel-title"><h2>정책 변경 목록</h2></div>
      <p class="list-subtitle">기본 조회: 영향도 큼 · 최신 변경순</p>
      <div class="quick-filters" role="group" aria-label="정책 변경 목록 필터">
        <button id="mode-all" type="button" class="quick-filter" aria-pressed="false">전체</button>
        <button id="mode-new" type="button" class="quick-filter" aria-pressed="false">신규</button>
        <button id="mode-amended" type="button" class="quick-filter" aria-pressed="false">개정</button>
        <button id="mode-repealed" type="button" class="quick-filter" aria-pressed="false">폐지</button>
        <button id="mode-impact" type="button" class="quick-filter active" aria-pressed="true"
          title="전국 공통 금액·자격 기준의 실제 변경 또는 근거가 확인된 5개 기관 이상"
          aria-label="영향도 큼 기본 조회">영향도 큼</button>
      </div>
      <input id="search" type="search" class="search" aria-label="법령명·정책명·소관기관 검색"
        placeholder="법령명·정책명·소관기관 검색" autocomplete="off">
      <div id="list-count" class="list-count" aria-live="polite">조회 중</div>
    </div>
    <div id="items" class="items"><p class="empty">변경 사건을 불러오는 중입니다.</p></div>
    <button id="more" class="more" type="button" hidden>변경 사건 더 보기</button>
  </aside>
  <section class="panel detail-panel" id="detailPanel" aria-label="선택한 정책의 변경 및 기관별 업무 검토">
    <div class="mobile-back"><button id="backToList" type="button">← 정책 목록</button></div>
    <article id="detail" class="detail" aria-live="polite">
      <p class="empty">왼쪽의 정책 변경 사건을 선택하세요.</p>
    </article>
  </section>
</main>
<footer class="footer">
  공식 근거: <a href="https://www.law.go.kr/" target="_blank" rel="noopener noreferrer">국가법령정보센터</a> ·
  <a href="https://www.alioplus.go.kr/" target="_blank" rel="noopener noreferrer">알리오플러스</a>
  <span id="updated"></span>
</footer>
<script src="./presentation.js"></script>
<script src="./app.js"></script>
</body>
</html>
