name: Policy Domino NEXT - Single Production Pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-next-single-production
  cancel-in-progress: false
jobs:
  verify_collect_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python source syntax
        run: python -m compileall -q policy_domino tests
      - name: Verify offline source, parser, analysis and queue
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check the single public page
        run: node tests/test_site.cjs
      - name: Run the only official-source pipeline
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          if [ -n "$LAW_OC" ]; then
            python -m policy_domino run --limit 30
          else
            echo "::warning::LAW_OC is not set; no live official data has been fetched."
            python -m policy_domino render
          fi
      - name: Verify public evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf8'))
          assert d['schema']=='policy-domino-next-v1'
          assert not d['principles']['manual_institutions']
          assert not d['principles']['inferred_programs_count_as_confirmed']
          assert not d['principles']['internal_compliance_status_known']
          for e in d['relationships']:
              assert e['relationship']=='verified_exact_article_citation'
              if not e['operational_program_verified']:
                  assert not e['required_action_verified']
          for doc in d['documents']:
              a=doc.get('analysis',{})
              if a.get('status') in ('queued','history_unavailable',
                                    'baseline_unavailable','body_unavailable','source_error'):
                  assert not a.get('changes')
          print('Contract validated:',len(d['documents']),'official records')
          PY
      - name: Save one data contract and persistent audit state
        run: |
          git config user.name policy-domino-next-bot
          git config user.email policy-domino-next-bot@users.noreply.github.com
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(next): official source audit update [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy this verified snapshot
        uses: actions/deploy-pages@v4
