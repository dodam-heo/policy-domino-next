name: Policy Domino NEXT - Single Production Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read

# Production runs must finish and must not cancel each other's Pages
# deployment or official evidence collection. PR checks can be superseded.
concurrency:
  group: policy-domino-next-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify official event and impact engine
        run: |
          python -m compileall -q policy_domino tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build current event output from official source ledger
        run: python -m policy_domino render
      - name: Test event-based interface
        run: node tests/test_site.cjs
      - name: Check official event and institutional evidence contracts
        run: python -m policy_domino.contracts site/data.json

  # Official source collection and Gemini reviews must not be blocked by a
  # GitHub Pages deployment that is syncing or experiencing an outage.
  # UI-only pushes deploy fast; schedule/manual runs refresh data first.
  collect_and_refresh:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[gov24-sync]') || contains(github.event.head_commit.message, '[rules-sync]'))) }}
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect official records and process unexamined backlog with time budget
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[rules-sync]')
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        timeout-minutes: 17
        run: python -m policy_domino run --limit 72 --time-budget 690
      - name: Collect official nationwide Gov24 services and operating criteria
        env:
          GOV24_SERVICE_KEY: ${{ secrets.GOV24_SERVICE_KEY }}
        timeout-minutes: 5
        run: python -m policy_domino gov24 --page-budget 10
      - name: Verify registered Gov24 key against real official API results
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('data/state.json').read_text(encoding='utf-8'))
          report=state.get('gov24_audit',{})
          safe={k:report.get(k) for k in ('status','accepted','rejected','attempted_pages','records_stored','errors')}
          print('Gov24 official API verification:', json.dumps(safe,ensure_ascii=False))
          if (report.get('status') in ('not_configured','partial') or
              not report.get('attempted_pages') or
              not report.get('accepted') or
              not report.get('records_stored') or
              report.get('errors')):
              raise SystemExit('Gov24 authentication or official service ingestion not yet successful.')
          PY
      - name: Incrementally review all verified changes with Gemini
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[rules-sync]')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        timeout-minutes: 8
        run: python -m policy_domino ai --limit 24
      - name: Enforce public source and impact evidence contract
        run: python -m policy_domino.contracts site/data.json
      - name: Persist verified collection results
        run: |
          git config user.name policy-domino-next-bot
          git config user.email policy-domino-next-bot@users.noreply.github.com
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(next): update verified official results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report AI evidence coverage without hiding partial results
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m policy_domino ai-check

  # ONE Pages deployment per workflow run:
  # - push: deploy verified UI immediately from existing official records
  # - schedule/manual: collect and persist first, then deploy the new snapshot
  publish:
    if: ${{ always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && (needs.collect_and_refresh.result == 'success' || needs.collect_and_refresh.result == 'skipped') }}
    needs: [verify, collect_and_refresh]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build public event data from current official records
        run: python -m policy_domino render
      - name: Enforce verified source contract before publishing
        run: python -m policy_domino.contracts site/data.json
      - name: Configure actual GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload one verified site snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages
      - name: Deploy verified site (allow Pages syncing to finish)
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: '1200000'
