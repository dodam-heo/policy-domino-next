name: Policy Domino NEXT - Single Production Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: policy-domino-next-${{ github.event_name == 'pull_request' && github.head_ref || 'publish' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python and JavaScript behavior
        run: |
          python -m compileall -q policy_domino tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_site.cjs
      - name: Audit real ALIOPLUS program responses (nonblocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from policy_domino.alioplus import ALIOPlusClient
          import re
          from policy_domino.alioplus import INDEX
          content = ALIOPlusClient(delay_seconds=0).fetch(INDEX)
          print("Index payload size:", len(content), "first characters:", repr(content[:180]))
          for word in ("bsnSeq", "bsnDetail", "fnDetail", "schSvcCate", "onclick", "사업정보"):
              hit = re.search(word, content, re.IGNORECASE)
              print("MARKER", word, "present:", bool(hit),
                    "sample:", repr(content[max(0, hit.start()-90):hit.end()+180]) if hit else "")
          anchors = re.findall(r"<a\\b[^>]{0,1000}>", content, re.IGNORECASE | re.DOTALL)
          print("BUSINESS ANCHORS:", [a[:250] for a in anchors
                if "bsn" in a.lower() or "business" in a.lower()][:12])
          state = {}
          report = ALIOPlusClient(delay_seconds=0).collect(state, max_details=2)
          print("Live program source audit:", report)
          print("Verified record count:", len(state.get("official_programs", {})))
          if report["accepted"] == 0:
              raise SystemExit("No verified program: public source compatibility is unproven")
          PY
      - name: Validate existing official publication evidence
        run: python -m policy_domino.contracts site/data.json

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure actual GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload initial verified site without waiting for network collection
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages
      - name: Deploy site immediately
        id: deploy
        uses: actions/deploy-pages@v4

  collect_and_refresh:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 22
    environment:
      name: github-pages
      url: ${{ steps.publish_refresh.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official data separately from website availability
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        timeout-minutes: 16
        run: python -m policy_domino run --limit 20
      - name: Enforce public source and impact evidence contract
        run: python -m policy_domino.contracts site/data.json
      - name: Persist verified collection results
        run: |
          git config user.name policy-domino-next-bot
          git config user.email policy-domino-next-bot@users.noreply.github.com
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(next): update verified official results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reconfigure Pages
        uses: actions/configure-pages@v5
      - name: Upload new official data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-refresh
      - name: Publish refreshed snapshot
        id: publish_refresh
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-refresh
