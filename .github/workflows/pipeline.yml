name: Policy Domino NEXT - Single Production Pipeline
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-next-publish-first-v2
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify code before publishing
        run: |
          python -m compileall -q policy_domino tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_site.cjs
      - name: Configure actual GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload initial verified site without waiting for network collection
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages
      - name: Deploy site immediately
        id: deploy
        uses: actions/deploy-pages@v4

  collect_and_refresh:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 22
    environment:
      name: github-pages
      url: ${{ steps.publish_refresh.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official data separately from website availability
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        timeout-minutes: 16
        run: python -m policy_domino run --limit 20
      - name: Verify evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf8'))
          assert d['schema']=='policy-domino-next-v1'
          assert not d['principles']['manual_institutions']
          assert not d['principles']['inferred_programs_count_as_confirmed']
          for rel in d['relationships']:
              assert rel['relationship']=='verified_exact_article_citation'
              assert not rel['required_action_verified']
          print('Verified source results:',len(d['documents']),'events')
          PY
      - name: Persist verified collection results
        run: |
          git config user.name policy-domino-next-bot
          git config user.email policy-domino-next-bot@users.noreply.github.com
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(next): update verified official results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reconfigure Pages
        uses: actions/configure-pages@v5
      - name: Upload new official data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-refresh
      - name: Publish refreshed snapshot
        id: publish_refresh
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-refresh
