name: Policy Domino NEXT - Single Production Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: policy-domino-next-${{ github.event_name == 'pull_request' && github.head_ref || 'publish' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python and JavaScript behavior
        run: |
          python -m compileall -q policy_domino tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_site.cjs
      - name: Validate official ALIOPLUS session-based form pagination (nonblocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.parse
          import http.cookiejar
          from policy_domino.alioplus import ALIOPlusClient, INDEX, listing_detail_urls
          session = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          req = urllib.request.Request(INDEX,headers={
              "User-Agent": "Mozilla/5.0 (compatible; PolicyDominoNext/0.2)"})
          with session.open(req,timeout=15) as response:
              index = response.read(1600000).decode("utf-8", "replace")
              cookie = response.headers.get("Set-Cookie","")
          path = re.search(r"/business/bsnByLifeList.do;jsessionid=([A-Za-z0-9.]+)",index)
          base = INDEX if not path else INDEX+";jsessionid="+path.group(1)
          params = {"pageNo":"2","typ":"life","schFstCateCd":"",
                    "schScdCateCd":"","schTrdCateCd":"","schLifeCycle":"",
                    "schSvcCate":"","schApbaId":"","schBsnNa":""}
          print("SESSION",bool(path),"COOKIE",bool(cookie),
                "first ids",listing_detail_urls(index)[:3])
          for method in ("GET","POST"):
              url=base+"?"+urllib.parse.urlencode(params)
              request=urllib.request.Request(
                  url, data=urllib.parse.urlencode(params).encode() if method=="POST" else None,
                  headers={"Content-Type":"application/x-www-form-urlencoded",
                           "User-Agent":"Mozilla/5.0 (compatible; PolicyDominoNext/0.2)"})
              try:
                  with session.open(request,timeout=15) as res:
                      body=res.read(1600000).decode("utf-8","replace")
                  found=listing_detail_urls(body)
                  total=re.search(r'class="total"[^>]*>.*?<strong>([^<]+)',body,re.S)
                  print("SESSION PAGE2",method, "ids",found[:5],
                        "count",len(found),"reported",total.group(1) if total else "unknown",
                        "is current page 2","<strong>2</strong>" in body)
              except Exception as exc:
                  print("SESSION PAGE2",method,"error",repr(exc))
          PY
      - name: Validate existing official publication evidence
        run: python -m policy_domino.contracts site/data.json

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure actual GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload initial verified site without waiting for network collection
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages
      - name: Deploy site immediately
        id: deploy
        uses: actions/deploy-pages@v4

  collect_and_refresh:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 22
    environment:
      name: github-pages
      url: ${{ steps.publish_refresh.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official data separately from website availability
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        timeout-minutes: 16
        run: python -m policy_domino run --limit 20
      - name: Enforce public source and impact evidence contract
        run: python -m policy_domino.contracts site/data.json
      - name: Persist verified collection results
        run: |
          git config user.name policy-domino-next-bot
          git config user.email policy-domino-next-bot@users.noreply.github.com
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(next): update verified official results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reconfigure Pages
        uses: actions/configure-pages@v5
      - name: Upload new official data
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-refresh
      - name: Publish refreshed snapshot
        id: publish_refresh
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-refresh
